name: Feature request
description: Propose new functionality
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today, or what is painful?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API / behavior
      description: Sketch the public API you'd want to call.
      render: csharp
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Including existing extension seams (handlers, IAccessTokenProvider, ConfigureResilience).
  - type: dropdown
    id: package
    attributes:
      label: Affected package
      options:
        - Koras.ApiClient
        - Koras.ApiClient.Abstractions
        - Koras.ApiClient.Testing
        - New sibling package
    validations:
      required: true
