name: Documentation issue
description: Report missing, unclear, or incorrect documentation
labels: [documentation, triage]
body:
  - type: input
    id: page
    attributes:
      label: Affected page
      placeholder: "docs/features/pagination.md"
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is missing, unclear, or wrong?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
