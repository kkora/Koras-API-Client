name: release

on:
  push:
    tags: ["v*"]

env:
  CI: "true"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

permissions:
  contents: write
  id-token: write # required for NuGet Trusted Publishing (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    # Protected environment: configure required reviewers in repo settings.
    # Publishing uses NuGet Trusted Publishing (OIDC) — no long-lived API key secret.
    # The Trusted Publishing policy on NuGet.org must reference this repo, workflow, and environment.
    environment: nuget-release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Derive version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Pack
        run: >
          dotnet pack --configuration Release --no-build
          --output artifacts/packages
          -p:Version=${{ steps.version.outputs.version }}

      # Exchanges this workflow's OIDC token for a short-lived NuGet.org API key.
      # Requires a Trusted Publishing policy on NuGet.org owned by the 'user' below:
      # repository owner: kkora, repository: Koras-API-Client, workflow: release.yml, environment: nuget-release.
      - name: NuGet login (Trusted Publishing / OIDC)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: kora.kanchan # NuGet.org profile that owns the Trusted Publishing policy

      - name: Publish to NuGet.org
        run: >
          dotnet nuget push "artifacts/packages/*.nupkg"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create GitHub release with packages
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
